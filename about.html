<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Orb</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
        }
        .orb-container {
            perspective: 1000px;
        }
        .orb {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff6347, #ff1493);
            border-radius: 50%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            transform: translateZ(100px);
        }
        @keyframes rotate {
            from { transform: rotateY(0deg) rotateX(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); }
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb"></div>
    </div>
    <script>
        const orb = document.querySelector('.orb');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = 100 * Math.sin(phi) * Math.cos(theta);
            const y = 100 * Math.sin(phi) * Math.sin(theta);
            const z = 100 * Math.cos(phi);
            particle.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
            orb.appendChild(particle);
        }
    </script>
</body>
</html>
